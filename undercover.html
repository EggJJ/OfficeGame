<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>办公文档</title>
<style>
:root {
    --card-bg: #ffffff;
    --card-border: rgba(0, 0, 0, 0.08);
    --text: #1f2328; --text-dim: #57606a; --text-muted: #8b949e;
    --accent: #5b63ff; --accent-2: #9c4fc4;
    --civ: #22c55e; --uc: #ef4444;
    --danger: #ef4444; --success: #22c55e; --warn: #f59e0b;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    max-width: 900px; margin: 0 auto; padding: 0 14px 40px;
    background: #f7f8fa; color: var(--text);
    min-height: 100vh;
}
h1 { font-size: 1.35em; margin: 0; font-weight: 700; color: var(--accent); letter-spacing: 1px; }

input[type=text] {
    padding: 10px 14px; border: 1px solid rgba(0,0,0,0.14);
    border-radius: 8px; width: 100%; font-size: 15px;
    background: #ffffff; color: var(--text);
    transition: all 0.2s; font-family: inherit;
}
input[type=text]:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,99,255,0.12); }
input[type=text]::placeholder { color: var(--text-muted); }

button {
    padding: 9px 18px; border: none; color: #fff;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 1px 4px rgba(91,99,255,0.2);
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    letter-spacing: 0.5px; font-family: inherit;
}
button:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(91,99,255,0.3); }
button:active { transform: translateY(0); }
button:disabled { background: #c0c4cc !important; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
button.ghost { background: #f5f6f8; color: var(--text); box-shadow: none; border: 1px solid rgba(0,0,0,0.1); }
button.ghost:hover { background: #ebedf0; }

/* 顶栏 */
.doc-topbar {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
    padding: 12px 4px; margin-bottom: 12px;
    background: transparent; border-bottom: 2px solid rgba(0,0,0,0.08);
}
.doc-status { font-size: 13px; color: var(--text-dim); }

/* 分节 */
.doc-section {
    padding: 16px 18px; margin-bottom: 12px;
    background: #fff; border: 1px solid rgba(0,0,0,0.06); border-radius: 6px;
}
.doc-label {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px;
}

/* 成员表 */
.doc-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.doc-table td {
    padding: 9px 8px; border-bottom: 1px solid rgba(0,0,0,0.05);
    vertical-align: middle;
}
.doc-table tr:last-child td { border-bottom: none; }
.doc-table .idx { color: var(--text-muted); width: 28px; font-variant-numeric: tabular-nums; }
.doc-table .nm { font-weight: 500; }
.doc-table .st { color: var(--text-muted); font-size: 12px; text-align: right; white-space: nowrap; }
.doc-table tr.dead td { opacity: 0.5; text-decoration: line-through; }
.doc-table tr.you td .nm { color: var(--accent); }
.doc-table .st .turn { color: var(--warn); font-weight: 700; }
.doc-table .st .role-uc { color: #b91c1c; font-weight: 700; }
.doc-table .st .role-civ { color: #15803d; }

/* 阶段横幅 */
.phase-banner {
    padding: 10px 16px; border-radius: 10px;
    background: linear-gradient(135deg, rgba(91,99,255,0.1), rgba(156,79,196,0.1));
    border: 1px solid rgba(91,99,255,0.25);
    color: var(--text); font-weight: 700; letter-spacing: 1px;
    margin: 4px 0 10px;
}
.phase-banner.civ { background: linear-gradient(135deg, rgba(34,197,94,0.12), rgba(21,128,61,0.12)); border-color: rgba(34,197,94,0.35); color: #15803d; }
.phase-banner.uc  { background: linear-gradient(135deg, rgba(239,68,68,0.12), rgba(185,28,28,0.12)); border-color: rgba(239,68,68,0.35); color: #b91c1c; }

/* 词语 */
.word-display {
    font-size: 2em; font-weight: 800; text-align: center;
    padding: 22px 10px; color: var(--accent);
    letter-spacing: 4px; user-select: all;
}

/* 日志 */
.msg {
    padding: 7px 12px; margin: 4px 0; border-radius: 8px;
    background: #f5f6f8;
    border-left: 3px solid rgba(0,0,0,0.15);
    font-size: 14px;
}
.msg-describe { border-left-color: var(--accent); background: rgba(91,99,255,0.06); }
.msg-out { color: #b91c1c; font-weight: 700; border-left: 4px solid var(--danger); background: rgba(239,68,68,0.1); }
.msg-end { color: #b45309; font-weight: 800; font-size: 1.05em;
    background: linear-gradient(135deg, rgba(245,158,11,0.18), rgba(156,79,196,0.18)); border-left: 4px solid var(--warn); }

/* 聊天 */
.chat-box {
    max-height: 200px; overflow-y: auto;
    border: 1px solid rgba(0,0,0,0.06); border-radius: 8px;
    padding: 8px 10px; margin: 6px 0; background: #fafbfc;
}
.chat-msg { padding: 3px 0; font-size: 14px; line-height: 1.5; }
.chat-msg .name { font-weight: 700; color: var(--accent); margin-right: 6px; }

/* 目标选择 */
.target-btn {
    display: inline-block; margin: 3px; padding: 8px 14px;
    background: #f5f6f8;
    border: 1px solid rgba(0,0,0,0.1);
    color: var(--text); cursor: pointer; border-radius: 8px;
    font-size: 13px; user-select: none;
    transition: all 0.15s; font-family: inherit;
}
.target-btn:hover { background: #ebedf0; transform: translateY(-1px); }

.err { color: #dc2626; margin-top: 8px; min-height: 18px; font-size: 13px; }
.hint { color: var(--text-dim); font-size: 12px; margin: 4px 0; }

/* 登录页 */
#loginView {
    max-width: 420px; margin: 14vh auto 0;
    text-align: center; padding: 32px 28px;
}
#loginView .doc-section { text-align: left; }
#loginView .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 18px; line-height: 1.6; }
#loginView input { margin-bottom: 14px; }
button + button { margin-left: 8px; }
</style>
</head>
<body>

<div id="loginView">
  <h1>办公文档</h1>
  <div class="subtitle">在线协作 · 谁是卧底</div>
  <div class="doc-section">
    <div class="doc-label">加入</div>
    <input id="roomInput" type="text" placeholder="房间号（加入已有房间时填写）" maxlength="6">
    <button onclick="createRoom()">新建房间</button>
    <button class="ghost" onclick="joinRoom()">加入房间</button>
    <div id="loginErr" class="err"></div>
    <div class="hint">4-5 人 · 自动编号（1号 2号…）· 每人只看自己的词</div>
  </div>
</div>

<div id="gameView" style="display:none">
  <div class="doc-topbar">
    <h1>办公文档</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="doc-status" id="topStatus"></div>
      <button class="ghost" style="padding:4px 12px;font-size:12px" onclick="exitRoom()">退出</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<script>
let token = localStorage.getItem('uc_token') || '';
let since = 0, chatSince = 0;
let lastState = null;
let lastSig = '';
let logs = [];   // 前端累积全量日志/聊天。服务端只发增量，
let chats = [];  // 不攒的话第二次轮询增量为空，整个框会消失

function post(url, body) {
    return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}).then(r=>r.json());
}
function get(url) { return fetch(url).then(r=>r.json()); }

function createRoom() {
    post('/api/create', {}).then(r => {
        if (r.roomId) { token = r.token; localStorage.setItem('uc_token', token); showGame(); }
        else document.getElementById('loginErr').textContent = r.err || '创建失败';
    });
}
function joinRoom() {
    const roomId = document.getElementById('roomInput').value.trim();
    if (!roomId) { document.getElementById('loginErr').textContent = '请填房间号'; return; }
    post('/api/join', {roomId}).then(r => {
        if (r.token) { token = r.token; localStorage.setItem('uc_token', token); showGame(); }
        else document.getElementById('loginErr').textContent = r.err || '加入失败';
    });
}

function showGame() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('gameView').style.display = '';
    poll();
}

function poll() {
    if (!token) return;
    get(`/api/state?token=${token}&since=${since}&chatSince=${chatSince}`).then(s => {
        if (s.error) { localStorage.removeItem('uc_token'); token=''; location.reload(); return; }
        lastState = s;
        // 增量追加进全量列表（按 id 去重）
        (s.log || []).forEach(m => { if (!logs.some(x => x.id === m.id)) logs.push(m); });
        (s.chat || []).forEach(m => { if (!chats.some(x => x.id === m.id)) chats.push(m); });
        const sig = JSON.stringify(s) + logs.length + chats.length;
        if (sig !== lastSig) { render(s); lastSig = sig; }  // 状态没变不重绘，防闪
        since = s.log_next || since;
        chatSince = s.chat_next || chatSince;
        setTimeout(poll, 1000);
    }).catch(() => setTimeout(poll, 2000));
}

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function act(body, cb) {
    body.token = token;
    post('/api/action', body).then(r => {
        if (cb) cb(r);
        else if (r.err) alert(r.err);
        // !ok + msg（如 "还没轮到你"）静默忽略，避免轮询抖动
    });
}

function refresh() {
    if (!token) return;
    get(`/api/state?token=${token}&since=0&chatSince=0`).then(s => {
        if (!s.error) { since = 0; chatSince = 0; lastSig = ''; poll(); }
    });
}

function exitRoom() {
    if (!confirm('确定退出房间？游戏中退出将视为出局。')) return;
    act({type:'leave'}, () => {
        localStorage.removeItem('uc_token');
        token = ''; location.reload();
    });
}

/* 成员表 */
function membersHtml(s) {
    const rows = s.players.map((p, i) => {
        const st = [];
        if (s.phase === 'describe' && s.speaker_token === p.token && p.alive)
            st.push('<span class="turn">▶ 描述中</span>');
        if (p.is_host) st.push('房主');
        if (p.left) st.push('已离场');
        else if (!p.alive) st.push('出局');
        if (s.phase === 'ended' && p.role)
            st.push(p.role === 'undercover'
                ? '<span class="role-uc">卧底</span>' : '<span class="role-civ">平民</span>');
        // 大厅里房主可以踢人（不能踢自己、不能踢已离场的）
        const kick = (s.isHost && s.phase === 'waiting' && !p.is_me && !p.left)
            ? ` <span class="target-btn" style="padding:2px 10px;font-size:11px" onclick="act({type:'kick',target:'${p.token}'},r=>{if(r.err)alert(r.err);})">踢</span>` : '';
        return `<tr class="${p.is_me ? 'you ' : ''}${(p.alive && !p.left) ? '' : 'dead'}">
            <td class="idx">${i + 1}</td>
            <td class="nm">${p.name}${p.is_me ? ' <span style="font-size:11px;color:var(--accent)">你</span>' : ''}${p.ready ? ' <span style="font-size:11px;color:var(--success)">✓</span>' : ''}</td>
            <td class="st">${st.join(' · ')}${kick}</td>
        </tr>`;
    }).join('');
    return `<div class="doc-section"><div class="doc-label">成员 ${s.players.length}/${5}</div>
        <table class="doc-table">${rows}</table></div>`;
}

function logHtml() {
    if (!logs.length) return '';
    return `<div class="doc-section"><div class="doc-label">操作记录</div>
        ${logs.map(m => {
            let cls = 'msg';
            if (m.text.includes('出局') || m.text.includes('被放逐')) cls = 'msg-out';
            else if (m.text.includes('游戏结束')) cls = 'msg-end';
            else if (m.text.includes('】：')) cls = 'msg-describe';
            return `<div class="${cls}">${esc(m.text)}</div>`;
        }).join('')}</div>`;
}

function chatHtml(s) {
    const canTalk = (s.phase === 'vote' || s.phase === 'describe') && s.alive;
    const sendBox = canTalk
        ? `<input id="chatInput" type="text" placeholder="讨论..." maxlength="200"
           onkeydown="if(event.key==='Enter'){act({type:'chat',text:this.value});this.value='';}">`
        : '';
    return `<div class="doc-section"><div class="doc-label">讨论</div>
        <div class="chat-box" id="chatBox">${chats.map(c=>`<div class="chat-msg"><span class="name">${esc(c.name)}</span>${esc(c.text)}</div>`).join('') || '<div class="hint">还没有讨论</div>'}</div>
        ${sendBox}</div>`;
}

function render(s) {
    document.getElementById('topStatus').textContent =
        `房间 ${s.roomId} · 第 ${s.round || '-'} 轮 · 存活 ${s.alive_count}`;
    const c = document.getElementById('content');
    // 重绘前记住正在输入的框（id/值/光标），重绘后恢复，防丢字
    const a = document.activeElement;
    let keep = null;
    if (a && a.tagName === 'INPUT' && a.id) {
        keep = {id: a.id, val: a.value, pos: a.selectionStart};
    }
    let html = membersHtml(s);
    if (s.phase === 'waiting')      html += waitingHtml(s);
    else if (s.phase === 'describe')html += wordCardHtml(s) + describeHtml(s);
    else if (s.phase === 'vote')    html += wordCardHtml(s) + voteHtml(s);
    else if (s.phase === 'ended')   html += endedHtml(s);
    html += logHtml();
    if (s.phase !== 'waiting') html += chatHtml(s);
    c.innerHTML = html;
    if (keep) {
        const el = document.getElementById(keep.id);
        if (el) {
            el.value = keep.val;
            const pos = Math.min(keep.pos ?? keep.val.length, keep.val.length);
            el.focus();
            el.setSelectionRange(pos, pos);
        }
    }
    const cb = document.getElementById('chatBox');
    if (cb) cb.scrollTop = cb.scrollHeight;
}

function waitingHtml(s) {
    if (s.isHost) {
        const n = s.players.length;
        const ucOptions = n >= 5
            ? `<button class="${s.uc_count===1?'':'ghost'}" onclick="act({type:'set_uc',count:1},r=>refresh())">1 卧底</button>
               <button class="${s.uc_count===2?'':'ghost'}" onclick="act({type:'set_uc',count:2},r=>refresh())">2 卧底</button>`
            : `<span class="hint">1 卧底（5 人局解锁双卧底）</span>`;
        const canStart = n >= 4;
        return `<div class="doc-section"><div class="doc-label">开局设置</div>
            <div class="hint">当前 ${n} 人。${canStart ? '可以开始。' : '至少需要 4 人。'}</div>
            <div style="margin:8px 0">${ucOptions}</div>
            <button onclick="act({type:'start_game'})" ${canStart?'':'disabled'}>开始游戏</button>
            </div>`;
    }
    return `<div class="doc-section"><div class="doc-label">等待</div>
        <div class="hint">当前 ${s.players.length} 人，${s.uc_count} 卧底。等房主开始。</div></div>`;
}

function wordCardHtml(s) {
    if (!s.viewed) {
        return `<div class="doc-section"><div class="doc-label">我的词</div>
            <div class="hint">确认周围没人再看。看完即可描述，不用等别人。</div>
            <button onclick="act({type:'view_word'}, r => { if(r.ok) refresh(); })">查看我的词</button></div>`;
    }
    return `<div class="doc-section"><div class="doc-label">我的词</div>
        <div class="word-display">${s.myWord}</div>
        <div class="hint" style="text-align:center">你是平民还是卧底？听描述自己判断</div></div>`;
}

function describeHtml(s) {
    const descThisRound = (s.descriptions||[]).map(d => `<div class="msg msg-describe"><b>${esc(d.name)}</b>：${esc(d.text)}</div>`).join('');
    const isSpeaker = s.speaker_token === token;
    let myTurn = '';
    if (isSpeaker && s.alive) {
        myTurn = `<div class="doc-section"><div class="doc-label">轮到你描述</div>
            <input id="descInput" type="text" placeholder="一句话，不能直接说出词中的任一字" maxlength="80"
              onkeydown="if(event.key==='Enter'){act({type:'describe',text:this.value});this.value='';}">
            <div style="margin-top:8px">
            <button onclick="act({type:'describe',text:document.getElementById('descInput').value});document.getElementById('descInput').value='';">提交</button>
            <button class="ghost" onclick="act({type:'skip_describe'})">跳过</button>
            </div></div>`;
    } else if (s.alive) {
        const sp = s.players.find(p => p.token === s.speaker_token);
        myTurn = `<div class="phase-banner">轮到【${sp?sp.name:'?'}】描述</div>`;
    } else {
        myTurn = `<div class="phase-banner">你已出局，观战中</div>`;
    }
    return `<div class="doc-section"><div class="doc-label">第 ${s.round} 轮 · 描述</div>
        ${descThisRound || '<div class="hint">等待开始...</div>'}</div>${myTurn}`;
}

function voteHtml(s) {
    const allDesc = (s.all_descriptions||[]).map(r =>
        `<div class="doc-section"><div class="doc-label">第 ${r.round} 轮描述</div>
        ${r.items.map(d=>`<div class="msg msg-describe"><b>${esc(d.name)}</b>：${esc(d.text)}</div>`).join('')}</div>`
    ).join('');
    let voteUI = '';
    if (!s.alive) {
        voteUI = `<div class="phase-banner">你已出局，观战中</div>`;
    } else if (s.voted) {
        voteUI = `<div class="phase-banner">已投票，等待其他玩家...</div>`;
    } else {
        const opts = (s.vote_targets||[]).map(t =>
            `<span class="target-btn" onclick="act({type:'vote',target:'${t.token}'})">投 ${t.name}</span>`
        ).join('');
        voteUI = `<div class="doc-section"><div class="doc-label">你的投票</div>
            <div class="hint">选你认为的卧底（不能投自己，不能改票）</div>
            <div>${opts}</div></div>`;
    }
    return allDesc + voteUI;
}

function endedHtml(s) {
    const civWin = s.winner === 'civilian';
    const truth = s.players.map(p =>
        `<tr><td class="nm">${p.name}</td><td class="st">${p.role === 'undercover' ? '<span class="role-uc">卧底</span>' : '<span class="role-civ">平民</span>'}</td></tr>`
    ).join('');
    return `<div class="phase-banner ${civWin?'civ':'uc'}" style="text-align:center;font-size:16px">${civWin?'平民获胜':'卧底获胜'}</div>
        <div class="doc-section"><div class="doc-label">真相</div>
        <div class="msg">平民词：<b>${s.civ_word}</b>　卧底词：<b>${s.uc_word}</b></div>
        <table class="doc-table">${truth}</table>
        </div>
        ${s.isHost ? '<button onclick="act({type:\'reset\'})">再来一局</button>' : '<div class="hint">等房主开新一局</div>'}`;
}

// 自动恢复 token
if (token) {
    get(`/api/state?token=${token}&since=0&chatSince=0`).then(s => {
        if (!s.error) showGame();
        else { localStorage.removeItem('uc_token'); token = ''; }
    }).catch(() => {});
}
</script>
</body>
</html>
